<app-admin-sub-menu></app-admin-sub-menu>

<main *ngIf="current_role === 'Admin'" class="admin-hospitals-main">
  <!-- Left Side: Facilities List Container -->
  <div class="hospitals-list-section">
    <app-searchbar></app-searchbar>

    <header class="section-title-header">
      <h1>Active Facilities</h1>
      <p>Manage registered healthcare providers and facility parameters.</p>
    </header>

    <div class="facility-data-card">
      <div class="table-head-row">
        <h4>Facility Name</h4>
        <h4>Longitude</h4>
        <h4>Latitude</h4>
        <h4>Status</h4>
      </div>

      <div class="facility-items-container">
        <ng-container *ngFor="let hospitalPage of paginatedHospitals; let i = index">
          <div *ngIf="i === currentPage" class="page-group">
            <ng-container *ngFor="let hospital_rep of hospitalPage">
              <div class="hospital-row-wrapper">
                <app-hospital 
                  *ngIf="hospital_rep.facility_Status === 'Active'" 
                  [hospital_rep]="hospital_rep" 
                  (facilityIdClicked)="onFacilityClicked($event)">
                </app-hospital>
              </div>
            </ng-container>
          </div>
        </ng-container>
      </div>
    </div>

    <!-- Pagination Controls -->
    <div class="pagination-controls" *ngIf="paginatedHospitals && paginatedHospitals.length > 0">
      <button class="page-btn" (click)="changePage(currentPage - 1)" [disabled]="currentPage === 0">
        <mat-icon>arrow_back</mat-icon>
        <span>Previous</span>
      </button>
      <span class="page-indicator">Page {{ currentPage + 1 }} of {{ paginatedHospitals.length }}</span>
      <button class="page-btn" (click)="changePage(currentPage + 1)" [disabled]="currentPage === paginatedHospitals.length - 1">
        <span>Next</span>
        <mat-icon>arrow_forward</mat-icon>
      </button>
    </div>
  </div>

  <!-- Right Side: Facility & Admin Form Container -->
  <div class="form-sidebar-container">
    <form (ngSubmit)="totalFunction()" class="management-form-card" #facilityForm="ngForm">
      <div class="form-section-title">
        <h2>Facility Details</h2>
      </div>

      <div class="field-group">
        <label for="facility_name">Facility Name</label>
        <input type="text" id="facility_name" placeholder="Enter facility name" [(ngModel)]="facility.facility_Name" name="facility_Name" required>
      </div>

      <div class="geo-coords-row">
        <div class="field-group">
          <label for="facility_Longitude">Longitude</label>
          <input readonly type="text" id="facility_Longitude" [value]="longi" placeholder="Longitude" [(ngModel)]="facility.facility_Longitude" name="facility_Longitude" required>
        </div>
        <div class="field-group">
          <label for="facility_Latitude">Latitude</label>
          <input readonly type="text" id="facility_Latitude" [value]="lati" placeholder="Latitude" [(ngModel)]="facility.facility_Latitude" name="facility_Latitude" required>
        </div>
      </div>

      <div class="form-section-title admin-title-spacing">
        <h2>Admin Details</h2>
      </div>

      <div class="field-group">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" placeholder="First name" [(ngModel)]="user.first_Name" name="user_first_Name" required>
      </div>

      <div class="field-group">
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" placeholder="Last name" [(ngModel)]="user.last_Name" name="user_last_Name" required>
      </div>

      <div class="field-group">
        <label for="gender">Gender</label>
        <input type="text" id="gender" placeholder="Gender" [(ngModel)]="user.user_Gender" name="user_Gender" required>
      </div>

      <div class="field-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="admin@facility.com" [(ngModel)]="user.email" name="user_email" required>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" [(ngModel)]="user.password" name="user_password" required>
      </div>

      <div class="form-actions-row">
        <button type="submit" class="btn-activate">Activate / Save</button>
        <button type="reset" class="btn-reject">Clear</button>
      </div>
    </form>
  </div>
</main>

<app-login-page *ngIf="current_role !== 'Admin'"></app-login-page>
