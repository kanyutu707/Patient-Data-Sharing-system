<div class="login-container">
  <section class="login-page">
    <div class="brand-header">
      <a routerLink="/" class="brand">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="2" stroke="#1F6F8B" stroke-width="1.6"/>
          <path d="M8 8H16" stroke="#1F6F8B" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M8 12H16" stroke="#1F6F8B" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M8 16H12" stroke="#1F6F8B" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>PDTS</span>
      </a>
    </div>

    <form class="login-form-card" (ngSubmit)="onSubmitLogin()" #loginForm="ngForm">
      <div class="intro">
        <div class="avatar-wrapper">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h3>Welcome Back</h3>
        <p>Sign in to access your secure health records</p>
      </div>

      <div class="input-section">
        <div class="field-group">
          <input type="email" placeholder="Email Address" class="form-control" name="email" [(ngModel)]="email" required>
        </div>
        <div class="field-group">
          <input type="password" placeholder="Password" class="form-control" name="password" [(ngModel)]="password" required>
        </div>

        <div class="login-action-row">
          <label class="remember-section" for="checkInput">
            <input type="checkbox" id="checkInput" name="remember" [(ngModel)]="rememberMe">
            <span>Remember Me</span>
          </label>
          <button type="submit" class="btn btn-primary">Login</button>
        </div>

        <div class="utilities-section">
          <a href="#" class="util-link">Register now</a>
          <a href="#" class="util-link" id="second">Forgot Password?</a>
        </div>
      </div>
    </form>
  </section>
</div>
