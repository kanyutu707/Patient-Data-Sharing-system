<app-menu></app-menu>

<main class="inpatient-main-container" *ngIf="current_role == 'Medical_Officer' || current_role == 'Medical_Admin'">
  <div class="wrap">
    <div class="search-section">
      <app-searchbar></app-searchbar>
    </div>

    <div class="inpatient-card">
      <header class="section-header">
        <h1>Inpatient Ward</h1>
        <p>Active admitted patients currently registered under your facility care.</p>
      </header>

      <div class="table-head-row">
        <h4>Photo</h4>
        <h4>Patient Name</h4>
        <h4>Gender</h4>
        <h4>Date of Birth</h4>
        <h4>Status</h4>
        <h4>Action</h4>
      </div>

      <div class="table-body">
        <ng-container *ngFor="let registered_rep of registrations; let i = index">
          <ng-container *ngIf="i < 5 && registered_rep.status === 'Inpatient' && registered_rep.facility_Details?.[i]?.facility_Id == current_Facility">
            <div class="patient-row-wrapper">
              <app-patient 
                [registration_rep]="registered_rep" 
                (openDiagnosisForm)="showDiagnosisForm($event)">
              </app-patient>
            </div>
          </ng-container>
        </ng-container>
      </div>
    </div>
  </div>
</main>

<app-login-page *ngIf="current_role !== 'Medical_Admin' && current_role !== 'Medical_Officer'"></app-login-page>
