<app-admin-sub-menu></app-admin-sub-menu>

<main *ngIf="current_role == 'Admin'">
  <div class="admin-facilities-container">
    <div class="wrap">
      
      <div class="top-search-row">
        <app-searchbar></app-searchbar>
      </div>

      <header class="section-header">
        <h1>Inactive Facilities</h1>
        <p>Review and activate pending healthcare providers requesting network access.</p>
      </header>

      <div class="facility-table-card">
        <div class="table-head-row">
          <h4>Facility Name</h4>
          <h4>Location</h4>
          <h4>Application Date</h4>
          <h4>Status</h4>
        </div>

        <div class="facility-list-body">
          <ng-container *ngFor="let hospitalPage of paginatedHospitals; let i = index">
            <ng-container *ngIf="i === currentPage">
              <ng-container *ngFor="let hospital_rep of hospitalPage">
                <ng-container *ngIf="hospital_rep.facility_Status === 'Inactive'">
                  <div class="hospital-row-item" (click)="openActivateDialog(hospital_rep.facility_Id?.toString())">
                    <app-hospital [hospital_rep]="hospital_rep" (facilityIdClicked)="onFacilityClicked($event)"></app-hospital>
                  </div>
                </ng-container>
              </ng-container>
            </ng-container>
          </ng-container>
        </div>
      </div>

      <div class="pagination-controls" *ngIf="paginatedHospitals && paginatedHospitals.length > 0">
        <button class="page-btn" (click)="changePage(currentPage - 1)" [disabled]="currentPage === 0">
          <mat-icon>arrow_back</mat-icon>
          <span>Previous</span>
        </button>
        <span class="page-indicator">Page {{ currentPage + 1 }} of {{ paginatedHospitals.length }}</span>
        <button class="page-btn" (click)="changePage(currentPage + 1)" [disabled]="currentPage === paginatedHospitals.length - 1">
          <span>Next</span>
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>

    </div>
  </div>
</main>

<app-login-page *ngIf="current_role !== 'Admin'"></app-login-page>
